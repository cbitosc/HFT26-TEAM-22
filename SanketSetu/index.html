<!doctype html>
<html lang="en" data-theme="light" style="background-color: #F7F8FA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F7F8FA" />
    <title>Sanket Setu — Offline Emergency Mesh</title>
    <meta name="description" content="Offline emergency messaging and SOS over a phone-to-phone mesh. Works with no internet or cell signal." />
    <script>
      // Apply a saved dark-mode choice before first paint (light is the default; the system
      // dark setting is intentionally ignored). Mirrors src/ui/theme.ts.
      try {
        if (localStorage.getItem('sanket-theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.style.backgroundColor = '#0F1115';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0F1115');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
